# Shadowrocket 配置片段 —— Xbox 家庭组-游戏掩护·付款换内购 (v1.1, HAR 实测校准)
# ------------------------------------------------------------
# 玩法:
#   1) 子号加购【游戏】       -> capture_ids 记 idsGame
#   2) 子号加购【内购/金币】   -> capture_ids 记 idsIAP
#   3) 子号对【游戏】发起家庭组购买
#   4) 主号 family safety 点"批准购买": POST account.microsoft.com/family/api/buy/requests/approve
#   5) 主号确认购买页: POST www.microsoft.com/store/purchase/buynowui/buynow (products=[...])
#   6) 子号下单: POST purchase.md.mp.microsoft.com/v7.0/users/me/orders
#   -> 第 4/5/6 步由 swap_payment 把 productId/skuId/availabilityId 换成内购
# 前提: 子号开启"购买需家长审批"; 家长号/子号在同一家庭组
# 用法: 把 [Script]/[MITM] 合并进你现有 .conf
# ------------------------------------------------------------

[Script]

gift_capture = type=http-request, pattern=^https://cart\.production\.store-web\.dynamics\.com/v\d+\.\d+/cart/(loadCart|addItems|add), requires-body=1, max-size=0, timeout=90, script-path=https://cdn.jsdelivr.net/gh/theslugger/xbox-family-gift@main/gift-swap/capture_ids.js

# 主号点"批准购买"->打标记(时序门控: 之后才允许替换)
gift_approve = type=http-request, pattern=^https://account\.microsoft\.com/family/api/buy/requests/approve, requires-body=1, max-size=0, timeout=90, script-path=https://cdn.jsdelivr.net/gh/theslugger/xbox-family-gift@main/gift-swap/approve_flag.js

gift_swap = type=http-request, pattern=^https://www\.microsoft\.com/store/purchase/buynowui/buynow, requires-body=1, max-size=0, timeout=90, script-path=https://cdn.jsdelivr.net/gh/theslugger/xbox-family-gift@main/gift-swap/swap_payment.js

[MITM]
hostname = %APPEND% *.microsoft.com, *.dynamics.com, account.microsoft.com
